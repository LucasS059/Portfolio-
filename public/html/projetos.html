                <span class="hero-badge">Portfolio</span>

        </div>

    <!-- Projects Grid -->
    <main class="projects-main">
        <div class="container">
            <div class="projects-grid" id="projectsGrid">
                <!-- Projects loaded dynamically -->
                <div class="project-skeleton">
                    <div class="skeleton-image"></div>

        <div class="modal-container">
            <button class="modal-close" id="modalClose" aria-label="Fechar">

                        <div class="carousel-main" id="carouselMain"></div>
                        <div class="carousel-controls">

                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="15 18 9 12 15 6"></polyline>
                                </svg>
                            </button>
                            <button class="carousel-btn next" id="carouselNext" aria-label="Próximo">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="9 18 15 12 9 6"></polyline>
                                </svg>
                            </button>

                        <div class="carousel-indicators" id="carouselIndicators"></div>
                    </div>

                <div class="modal-info-section">

                    <div class="modal-description" id="modalDescription"></div>
